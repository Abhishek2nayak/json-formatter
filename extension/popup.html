<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JSONWorkspace</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 280px;
      background: #0f0f0f;
      color: #e5e5e5;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px 12px;
      border-bottom: 1px solid #1e1e1e;
    }

    .logo {
      width: 32px; height: 32px; border-radius: 9px;
      background: #10b981; display: flex; align-items: center;
      justify-content: center; font-weight: 900; font-size: 13px; color: white;
      flex-shrink: 0;
    }

    .title { font-weight: 700; font-size: 14px; color: white; }
    .subtitle { font-size: 11px; color: #6b7280; margin-top: 1px; }

    .section { padding: 12px 16px; border-bottom: 1px solid #1e1e1e; }
    .section-label {
      font-size: 10px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.08em; color: #4b5563; margin-bottom: 8px;
    }

    .btn {
      display: flex; align-items: center; gap-8px;
      width: 100%; padding: 9px 12px; border-radius: 10px;
      border: 1px solid #1e1e1e; background: #141414;
      color: #e5e5e5; font-size: 12px; font-weight: 600;
      cursor: pointer; text-align: left; gap: 8px;
      font-family: inherit; transition: border-color 0.15s, background 0.15s;
      margin-bottom: 6px;
    }
    .btn:last-child { margin-bottom: 0; }
    .btn:hover { border-color: #2a2a2a; background: #181818; }
    .btn .dot {
      width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
    }
    .btn .arrow { margin-left: auto; color: #4b5563; font-size: 14px; }

    .btn-primary {
      background: #10b981; border-color: #10b981; color: white;
      margin-bottom: 6px;
    }
    .btn-primary:hover { background: #059669; border-color: #059669; }

    #status {
      padding: 10px 16px;
      font-size: 11px;
      color: #10b981;
      display: none;
    }

    .footer {
      padding: 10px 16px;
      font-size: 10px; color: #374151;
      text-align: center;
    }
    .footer a { color: #4b5563; text-decoration: none; }
    .footer a:hover { color: #9ca3af; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">{}</div>
    <div>
      <div class="title">JSONWorkspace</div>
      <div class="subtitle">Developer JSON toolkit</div>
    </div>
  </div>

  <div class="section">
    <div class="section-label">Current page</div>
    <button class="btn btn-primary" id="btn-open-page">
      Open page JSON in editor →
    </button>
    <button class="btn" id="btn-open-selection">
      <span class="dot" style="background:#10b981"></span>
      Open selected text as JSON
      <span class="arrow">›</span>
    </button>
  </div>

  <div class="section">
    <div class="section-label">Quick links</div>
    <button class="btn" id="btn-formatter">
      <span class="dot" style="background:#10b981"></span>
      JSON Formatter
      <span class="arrow">›</span>
    </button>
    <button class="btn" id="btn-validator">
      <span class="dot" style="background:#38bdf8"></span>
      JSON Validator
      <span class="arrow">›</span>
    </button>
    <button class="btn" id="btn-path">
      <span class="dot" style="background:#a78bfa"></span>
      JSONPath Explorer
      <span class="arrow">›</span>
    </button>
    <button class="btn" id="btn-mock">
      <span class="dot" style="background:#f59e0b"></span>
      Mock Generator
      <span class="arrow">›</span>
    </button>
  </div>

  <div id="status">✓ Opened in JSONWorkspace</div>

  <div class="footer">
    <a href="https://jsonworkspace.mythosh.com" target="_blank">jsonworkspace.mythosh.com</a>
  </div>

  <script src="lz-string.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
